<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1b0d3a"/>
      <stop offset="55%" stop-color="#0d0620"/>
      <stop offset="100%" stop-color="#020108"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF00E5"/>
      <stop offset="50%" stop-color="#B14CFF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <radialGradient id="planetGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9be8ff"/>
      <stop offset="45%" stop-color="#3d8bff"/>
      <stop offset="100%" stop-color="#1b1465"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF00E5" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Twinkling starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="30" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="70" r="1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="45" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="20" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="55" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="35" r="1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="65" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="25" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="50" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="80" r="1"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="230" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="260" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="240" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="255" r="1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="235" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="260" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Shooting star -->
  <g>
    <line x1="0" y1="0" x2="60" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <animateMotion path="M -100,40 L 1300,180" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Ringed planet, top right -->
  <g transform="translate(1030,70)">
    <ellipse cx="0" cy="0" rx="95" ry="20" fill="none" stroke="url(#ringGrad)" stroke-width="6" transform="rotate(-18)"/>
    <circle cx="0" cy="0" r="42" fill="url(#planetGrad)" filter="url(#softGlow)"/>
    <ellipse cx="0" cy="0" rx="95" ry="20" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6" transform="rotate(-18)"/>
  </g>

  <!-- UFO drifting -->
  <g>
    <g>
      <ellipse cx="0" cy="0" rx="34" ry="10" fill="#0D1117" stroke="#00F0FF" stroke-width="2"/>
      <path d="M -18,-4 Q 0,-26 18,-4 Z" fill="#302B63" stroke="#FF00E5" stroke-width="1.6"/>
      <circle cx="-12" cy="1" r="3" fill="#00F0FF"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="3" r="3" fill="#FF00E5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/></circle>
      <circle cx="12" cy="1" r="3" fill="#00F0FF"><animate attributeName="opacity" values="1;0.2;1" dur="1s" begin="0.5s" repeatCount="indefinite"/></circle>
      <animateMotion path="M 150,240 Q 400,190 650,235 T 1150,225" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800"
        font-size="58" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="4">
    JUDE JOBY JOSEPH
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="Consolas, Fira Code, monospace"
        font-size="20" fill="#8be9fd" letter-spacing="3" opacity="0.9">
    &gt; TRANSMITTING FROM SECTOR: BUILD // ML // SECURE_SYSTEMS
  </text>
</svg>
